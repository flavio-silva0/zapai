<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente de esmeralda vivo para o balão Zap/AI -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <!-- Sombra sutil de software corporativo -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Top Bubble: Cliente / Pergunta (Slate 900) -->
    <!-- Balão com cauda à esquerda inferior -->
    <path d="M 170 100 
             L 370 100 
             C 414 100, 440 126, 440 170 
             L 440 230 
             C 440 274, 414 300, 370 300 
             L 280 300 
             L 210 370 
             L 210 300 
             L 170 300 
             C 126 300, 100 274, 100 230 
             L 100 170 
             C 100 126, 126 100, 170 100 Z" 
          fill="#0F172A" />

    <!-- Elemento Z central e Balão ZapAI (Emerald) -->
    <!-- Balão inferior da atendente com cauda à direita e corte geométrico Z -->
    <path d="M 342 412 
             L 142 412 
             C 98 412, 72 386, 72 342 
             L 72 282 
             C 72 238, 98 212, 142 212 
             L 232 212 
             L 302 142 
             L 302 212 
             L 342 212 
             C 386 212, 412 238, 412 282 
             L 412 342 
             C 412 386, 386 412, 342 412 Z" 
          fill="url(#emeraldGrad)" 
          opacity="0.95" />

    <!-- O 'Z' de alta velocidade recortado em espaço negativo / conector de luz -->
    <!-- Formado pela intersecção dinâmica dos fluxos -->
    <path d="M 180 180 
             L 340 180 
             L 340 216 
             L 228 304 
             L 340 304 
             L 340 340 
             L 180 340 
             L 180 304 
             L 292 216 
             L 180 216 Z" 
          fill="#FFFFFF" />
  </g>
</svg>